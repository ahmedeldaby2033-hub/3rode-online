# nginx for 3rode.online (static site, Arabic RTL)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # clean directory URLs: /mobiles/<slug>/ -> <slug>/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # product images + assets: cache a week
    location ~* \.(jpg|jpeg|png|webp|svg|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # prices change hourly: never cache HTML, sitemaps or the service worker
    location ~* \.(html|xml)$ {
        expires 0;
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        expires 0;
        add_header Cache-Control "no-store";
    }
}
