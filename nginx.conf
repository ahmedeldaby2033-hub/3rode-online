# nginx for 3rde.online (static site, Arabic RTL)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # security headers (audit 2026-11-25). Note: nginx `add_header` in a
    # location block replaces inherited headers, so the blocks below repeat
    # these four lines where they also set Cache-Control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # browsers request /favicon.ico; serve the real PNG icon instead of 404
    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /assets/favicon.png =404;
    }

    # clean directory URLs: /mobiles/<slug>/ -> <slug>/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # admin panel: server-level Basic Auth (the panel's own admin/admin
    # login is a second layer). ^~ wins over the regex locations below,
    # so /adamwnor/index.html is protected too. The rest of the site stays public.
    location ^~ /adamwnor {
        auth_basic "Admin area - 3rde.online";
        auth_basic_user_file /etc/nginx/htpasswd;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # product images + assets: cache a week
    location ~* \.(jpg|jpeg|png|webp|svg|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # prices change hourly: never cache HTML, sitemaps or the service worker
    location ~* \.(html|xml)$ {
        expires 0;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location = /sw.js {
        expires 0;
        add_header Cache-Control "no-store";
    }
}
